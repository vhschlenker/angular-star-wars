<table>
  <tbody>
    @for (item of data(); track item) {
      <tr>
        <th scope="row">{{ item.name }}</th>
        <td>Height: {{ item.height }}</td>
        <td>Hair color: {{ item.hair_color }}</td>
        <br />
        <a [routerLink]="['/character', getId(item)]">Navigate to character</a>
      </tr>
    }
  </tbody>
</table>
